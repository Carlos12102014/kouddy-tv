<!doctype html>
<html lang="es">
<head>
    <!-- TVs viejos (sin type="module"): fetch y AbortController antes que todo. -->
    <script nomodule src="./legacy/fetch.js"></script>
    <script nomodule src="./legacy/abortcontroller.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />
  <meta name="darkreader-lock" />
  <title>Kouddy+ Control</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kouddy+" />
  <script>
    // Tema Dia/Noche antes de pintar (sin parpadeo negro al abrir en modo Dia).
    try { if (localStorage.getItem('kouddy_remote_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
  <script type="module" crossorigin src="./assets/control-Bs6a8ieJ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/update-CUPC5n4c.js">
  <link rel="stylesheet" crossorigin href="./assets/control-BZKJ438E.css">
  <script type="module">import'data:text/javascript,if(!import.meta.resolve)throw Error("import.meta.resolve not supported")';import.meta.url;import("_").catch(()=>1);(async function*(){})().next();window.__vite_is_modern_browser=true</script>
  <script type="module">!function(){if(window.__vite_is_modern_browser)return;console.warn("vite: loading legacy chunks, syntax error above and the same error below should be ignored");var e=document.getElementById("vite-legacy-polyfill"),n=document.createElement("script");n.src=e.src,n.onload=function(){System.import(document.getElementById('vite-legacy-entry').getAttribute('data-src'))},document.body.appendChild(n)}();</script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <p class="wordmark">Kouddy<span>+</span></p>
      <div class="top-right">
        <p id="tv-status" class="tv-status">Conectando con tu TV…</p>
        <button id="theme-btn" class="theme-btn" aria-label="Cambiar a modo día">☀ Día</button>
      </div>
    </div>
  </header>

  <main id="view-catalog" class="view">
    <nav class="tabs" id="tabs">
      <button data-tab="home">Inicio</button>
      <button data-tab="live">En vivo</button>
      <button data-tab="movies">Películas</button>
      <button data-tab="series">Series</button>
    </nav>
    <div class="search" id="search-box">
      <input id="search" type="search" placeholder="Buscar" autocomplete="off" />
    </div>
    <div id="chips" class="chips"></div>
    <div id="list" class="list"></div>
  </main>

  <main id="view-message" class="view message">
    <p class="wordmark">Kouddy<span>+</span></p>
    <h1 id="message-title"></h1>
    <p id="message-text"></p>
    <a id="message-action" class="primary" href="#"></a>
    <form id="link-form" class="link-form" style="display:none">
      <label for="link-input">O escribe el código de control que aparece en el TV</label>
      <input id="link-input" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="0000 0000" />
      <label for="link-name" id="link-name-label">Nombre para este TV (opcional)</label>
      <input id="link-name" class="link-name" autocomplete="off" maxlength="24" placeholder="Ej: Sala, Cuarto" />
      <button type="submit" class="primary">Conectar</button>
      <button type="button" id="link-cancel" class="link-cancel" style="display:none">Cancelar</button>
      <p id="link-error" class="link-error"></p>
    </form>
  </main>

  <!-- Hoja de serie (temporadas y episodios) -->
  <div id="sheet" class="sheet">
    <div class="sheet-panel">
      <button id="sheet-close" class="sheet-close" aria-label="Cerrar">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <!-- Hoja de opciones genérica (reanudar, idioma, subtítulos, pantalla) -->
  <div id="choice" class="sheet choice">
    <div class="sheet-panel">
      <h2 id="choice-title"></h2>
      <p id="choice-note" class="meta"></p>
      <div id="choice-list"></div>
      <button id="choice-cancel" class="choice-cancel">Cancelar</button>
    </div>
  </div>

  <!-- Barra mini de lo que se está viendo -->
  <footer id="mini" class="mini">
    <button id="mini-open" class="mini-open">
      <span id="mini-art" class="mini-art"></span>
      <span class="mini-text">
        <span id="mini-kind" class="mini-kind"></span>
        <span id="mini-title" class="mini-title"></span>
      </span>
    </button>
    <button id="mini-toggle" class="mini-toggle" aria-label="Pausa">❚❚</button>
  </footer>

  <!-- Control completo -->
  <section id="remote" class="remote">
    <div class="remote-top">
      <button id="remote-close" class="icon-btn" aria-label="Cerrar">⌄</button>
      <p class="remote-label">Reproduciendo en tu TV</p>
      <button id="btn-stop" class="icon-btn" aria-label="Detener">■</button>
    </div>
    <div id="remote-art" class="remote-art"></div>
    <p id="now-kind" class="now-kind"></p>
    <p id="now-title" class="now-title"></p>
    <p id="now-note" class="now-note"></p>

    <div id="now-progress" class="progress">
      <span id="now-pos">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0" />
      <span id="now-dur">0:00</span>
    </div>

    <div class="controls">
      <button id="btn-prev" class="icon-btn" aria-label="Anterior">⏮</button>
      <button id="btn-back10" class="icon-btn" aria-label="Atrás 10 segundos">−10</button>
      <button id="btn-toggle" class="play-btn" aria-label="Pausa">❚❚</button>
      <button id="btn-fwd10" class="icon-btn" aria-label="Adelantar 10 segundos">+10</button>
      <button id="btn-next" class="icon-btn" aria-label="Siguiente">⏭</button>
    </div>

    <div class="volume">
      <button id="btn-voldown" class="small-btn">Vol −</button>
      <button id="btn-mute" class="small-btn">Silencio</button>
      <button id="btn-volup" class="small-btn">Vol +</button>
    </div>

    <div class="actions">
      <button id="btn-fav" class="action"><span class="action-icon">♡</span><span>Favorito</span></button>
      <button id="btn-audio" class="action"><span class="action-icon">A</span><span>Idioma</span></button>
      <button id="btn-subs" class="action"><span class="action-icon">CC</span><span>Subtítulos</span></button>
      <button id="btn-aspect" class="action"><span class="action-icon">▭</span><span>Pantalla</span></button>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <script nomodule>!function(){var e=document,t=e.createElement("script");if(!("noModule"in t)&&"onbeforeload"in t){var n=!1;e.addEventListener("beforeload",(function(e){if(e.target===t)n=!0;else if(!e.target.hasAttribute("nomodule")||!n)return;e.preventDefault()}),!0),t.type="module",t.src=".",e.head.appendChild(t),t.remove()}}();</script>
  <script nomodule crossorigin id="vite-legacy-polyfill" src="./assets/polyfills-legacy-C64qYCu2.js"></script>
  <script nomodule crossorigin id="vite-legacy-entry" data-src="./assets/control-legacy-CHSjTVgl.js">System.import(document.getElementById('vite-legacy-entry').getAttribute('data-src'))</script>
</body>
</html>
